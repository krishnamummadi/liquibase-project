name: Demo CI - Liquibase POC

on:
  push:
    paths:
      - '**/changelogs/**'
      - 'scripts/**'
      - 'config/**'
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
      LIQUIBASE_IMAGE: liquibase/liquibase:4.31.1
    # Start SQL Server container explicitly in a runner step so we can capture logs
    # and diagnose initialization failures more easily (avoids opaque service failures).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mssql-tools (sqlcmd)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl apt-transport-https gnupg
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 mssql-tools unixodbc-dev
          echo "PATH=$PATH:/opt/mssql-tools/bin" >> $GITHUB_ENV

      - name: Start SQL Server container
        run: |
          echo "Starting SQL Server container..."
          docker run -d --name mssql -e ACCEPT_EULA=Y -e SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest || (
            echo "docker run failed, printing last container logs (if any)";
            docker ps -a || true;
            docker logs mssql || true;
            exit 1
          )

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" -b -h -1 >/dev/null 2>&1; then
              echo "SQL Server ready"; break
            fi
            echo "Waiting for SQL Server... ($i)"; sleep 5
          done
      - name: Create demo databases
        run: |
          echo "Creating demo databases..."
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -i scripts/init-databases.sql
      - name: Apply changelogs to dev
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway -v ${{ github.workspace }}:/workspace -w /workspace ${{ env.LIQUIBASE_IMAGE }} \
            --changeLogFile=changelogs/master.xml \
            --url="jdbc:sqlserver://host.docker.internal:1433;databaseName=liquibase_dev;encrypt=true;trustServerCertificate=true" \
            --username=sa --password="$SA_PASSWORD" update

      - name: Apply changelogs to stage
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway -v ${{ github.workspace }}:/workspace -w /workspace ${{ env.LIQUIBASE_IMAGE }} \
            --changeLogFile=changelogs/master.xml \
            --url="jdbc:sqlserver://host.docker.internal:1433;databaseName=liquibase_stage;encrypt=true;trustServerCertificate=true" \
            --username=sa --password="$SA_PASSWORD" update

      - name: Promote to test
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway -v ${{ github.workspace }}:/workspace -w /workspace ${{ env.LIQUIBASE_IMAGE }} \
            --changeLogFile=changelogs/master.xml \
            --url="jdbc:sqlserver://host.docker.internal:1433;databaseName=liquibase_test;encrypt=true;trustServerCertificate=true" \
            --username=sa --password="$SA_PASSWORD" update --contexts test

      - name: Seed test from stage (sqlcmd)
        run: |
          sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -i scripts/seed-test-from-stage.sql -b -C

      - name: Validate schema and data counts
        run: |
          set -e
          customers=$(sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -d liquibase_test -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Customers" -h -1 | tr -d '[:space:]')
          orders=$(sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -d liquibase_test -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Orders" -h -1 | tr -d '[:space:]')
          echo "Customers=$customers Orders=$orders"
          if [ "$customers" = "2" ] && [ "$orders" = "2" ]; then
            echo "Validation passed"
          else
            echo "Validation failed: expected 2/2 but got $customers/$orders"; exit 1
          fi
